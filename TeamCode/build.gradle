//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    compileSdk 34
    defaultConfig {
        minSdk 24
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            useJUnitPlatform()
        }
    }

    sourceSets {
        main.java.srcDirs = ['src/main/java']
        test.java.srcDirs = ['src/test/java']
        androidTest.java.srcDirs = ['src/androidTest/java']
    }
}

ext.junitVersion = "5.10.3"
dependencies {
    implementation project(':FtcRobotController')
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testImplementation "org.mockito:mockito-core:5.13.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation 'org.java-websocket:Java-WebSocket:1.6.0'
    testImplementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.ftclib.ftclib:core:2.1.1' // core
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.7'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.4.21'
}

tasks.register("runSwerveSimulator", JavaExec) {
    dependsOn("compileDebugJavaWithJavac", "compileDebugUnitTestJavaWithJavac", "processDebugUnitTestJavaRes")
    mainClass = "org.firstinspires.ftc.teamcode.Swerve.Sim.SwerveSimulatorServer"
    doFirst {
        def compileTask = tasks.named("compileDebugUnitTestJavaWithJavac").get()
        def compileClasspath = []
        if (compileTask.hasProperty("classpath") && compileTask.classpath != null) {
            compileClasspath = compileTask.classpath.files
        }
        setClasspath(project.files(
                compileClasspath,
                "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes",
                "$buildDir/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes",
                "$buildDir/intermediates/java_res/debug/processDebugJavaRes/out",
                "$buildDir/intermediates/java_res/debugUnitTest/processDebugUnitTestJavaRes/out"
        ))
    }
}
