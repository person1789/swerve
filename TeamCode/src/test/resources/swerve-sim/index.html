<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Swerve Simple Sim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f2efe8;
      --ink: #1f2a2c;
      --panel: #fffaf2;
      --line: #d5cbbb;
      --accent: #0c7c59;
      --warn: #c44536;
      --robot: #28536b;
      --front: #d1495b;
      --module: #f4a259;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fff8ea, var(--bg));
      color: var(--ink);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 340px;
      gap: 20px;
      min-height: 100vh;
      padding: 20px;
    }
    .field, .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 250, 242, 0.94);
      box-shadow: 0 12px 40px rgba(31, 42, 44, 0.08);
    }
    .field {
      position: relative;
      overflow: hidden;
      min-height: 720px;
      background-image:
        linear-gradient(rgba(12, 124, 89, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(12, 124, 89, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .field-title, .panel h1, .panel h2 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .field-title {
      position: absolute;
      left: 18px;
      top: 14px;
      z-index: 2;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.82);
    }
    .robot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 168px;
      height: 168px;
      margin-left: -84px;
      margin-top: -84px;
      transform-origin: center;
    }
    .chassis {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      border: 4px solid var(--robot);
      background: rgba(40, 83, 107, 0.12);
    }
    .front-edge {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 8px;
      height: 10px;
      border-radius: 999px;
      background: var(--front);
    }
    .module {
      position: absolute;
      width: 42px;
      height: 42px;
      margin-left: -21px;
      margin-top: -21px;
      border-radius: 12px;
      border: 2px solid rgba(31, 42, 44, 0.22);
      background: var(--module);
      transform-origin: center;
      transition: transform 40ms linear, background 100ms linear;
    }
    .module::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 6px;
      width: 5px;
      height: 18px;
      margin-left: -2.5px;
      border-radius: 999px;
      background: rgba(31, 42, 44, 0.85);
    }
    .panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .banner {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(12, 124, 89, 0.12);
      line-height: 1.45;
    }
    .banner.warn {
      background: rgba(196, 69, 54, 0.12);
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: white;
    }
    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5f6b6d;
    }
    .stat-value {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 700;
    }
    .module-list {
      display: grid;
      gap: 10px;
    }
    .module-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }
    .module-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .module-card p {
      margin: 4px 0;
      font-size: 13px;
    }
    code {
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(31, 42, 44, 0.08);
    }
    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .field {
        min-height: 540px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <section class="field">
      <div class="field-title">Swerve Module Output View</div>
      <div id="robot" class="robot">
        <div class="chassis"></div>
        <div class="front-edge"></div>
        <div id="module-0" class="module"></div>
        <div id="module-1" class="module"></div>
        <div id="module-2" class="module"></div>
        <div id="module-3" class="module"></div>
      </div>
    </section>
    <aside class="panel">
      <h1>Simple Driver Sim</h1>
      <div id="gamepadBanner" class="banner warn">Connect a controller, press any button, and keep this tab focused so the browser can read the Gamepad API.</div>
      <div class="banner">
        Left stick drives translation, right stick drives rotation, D-pad snaps heading, and the <code>Y / Triangle</code> button resets heading to zero.
      </div>
      <div class="stats" id="stats"></div>
      <h2>Modules</h2>
      <div id="moduleList" class="module-list"></div>
    </aside>
  </div>
  <script>
    const robotEl = document.getElementById("robot");
    const moduleEls = [0, 1, 2, 3].map((i) => document.getElementById(`module-${i}`));
    const statsEl = document.getElementById("stats");
    const moduleListEl = document.getElementById("moduleList");
    const gamepadBanner = document.getElementById("gamepadBanner");
    const pxPerMeter = 95;

    let lastInputPost = 0;

    function clamp(v) {
      return Math.max(-1, Math.min(1, v));
    }

    function gamepadPayload() {
      const pad = navigator.getGamepads ? navigator.getGamepads()[0] : null;
      if (!pad) {
        return {
          leftX: 0, leftY: 0, rightX: 0,
          dpadUp: false, dpadRight: false, dpadDown: false, dpadLeft: false,
          resetHeading: false, connected: false
        };
      }
      return {
        leftX: clamp(pad.axes[0] || 0),
        leftY: clamp(pad.axes[1] || 0),
        rightX: clamp(pad.axes[2] || pad.axes[3] || 0),
        dpadUp: Boolean(pad.buttons[12]?.pressed),
        dpadRight: Boolean(pad.buttons[15]?.pressed),
        dpadDown: Boolean(pad.buttons[13]?.pressed),
        dpadLeft: Boolean(pad.buttons[14]?.pressed),
        resetHeading: Boolean(pad.buttons[3]?.pressed),
        connected: true
      };
    }

    async function postInput() {
      try {
        await fetch("/api/input", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(gamepadPayload())
        });
      } catch (_) {
      }
    }

    function moduleColor(power) {
      const intensity = Math.min(1, Math.abs(power));
      const hue = power >= 0 ? 140 : 10;
      return `hsl(${hue} ${70 + intensity * 20}% ${70 - intensity * 18}%)`;
    }

    function renderStats(state) {
      const stats = [
        ["Pose X", `${state.pose.xMeters.toFixed(2)} m`],
        ["Pose Y", `${state.pose.yMeters.toFixed(2)} m`],
        ["Heading", `${state.pose.headingDegrees.toFixed(1)} deg`],
        ["Linear Speed", `${state.actualVelocity.linearSpeed.toFixed(2)} m/s`],
        ["Omega", `${state.actualVelocity.omega.toFixed(2)} rad/s`],
        ["Drivetrain", state.drivetrainState],
        ["Heading Hold", state.headingHold ? "active" : "idle"],
        ["Snap", state.snapping ? state.activeSnap : "none"]
      ];
      statsEl.innerHTML = stats.map(([label, value]) => `
        <div class="stat">
          <div class="stat-label">${label}</div>
          <div class="stat-value">${value}</div>
        </div>
      `).join("");
    }

    function renderModules(state) {
      state.modules.forEach((module, index) => {
        const x = 84 + module.xMeters * pxPerMeter;
        const y = 84 - module.yMeters * pxPerMeter;
        moduleEls[index].style.left = `${x}px`;
        moduleEls[index].style.top = `${y}px`;
        moduleEls[index].style.transform = `translate(-50%, -50%) rotate(${module.currentAngleRadians}rad)`;
        moduleEls[index].style.background = moduleColor(module.drivePower);
      });

      moduleListEl.innerHTML = state.modules.map((module) => `
        <div class="module-card">
          <h3>${module.name}</h3>
          <p>Current angle: <strong>${module.currentAngleDegrees.toFixed(1)} deg</strong></p>
          <p>Target angle: <strong>${module.targetAngleDegrees.toFixed(1)} deg</strong></p>
          <p>Actual velocity: <strong>${module.actualVelocityMps.toFixed(2)} m/s</strong></p>
          <p>Target velocity: <strong>${module.targetVelocityMps.toFixed(2)} m/s</strong></p>
          <p>Drive power: <strong>${module.drivePower.toFixed(2)}</strong></p>
          <p>Steer power: <strong>${module.steerPower.toFixed(2)}</strong></p>
        </div>
      `).join("");
    }

    function renderGamepadStatus(connected) {
      if (connected) {
        gamepadBanner.className = "banner";
        gamepadBanner.textContent = "Controller detected. Drive the mocked hardware through the real Java pipeline.";
      } else {
        gamepadBanner.className = "banner warn";
        gamepadBanner.textContent = "Connect a controller, press any button, and keep this tab focused so the browser can read the Gamepad API.";
      }
    }

    async function refreshState() {
      try {
        const response = await fetch("/api/state");
        const state = await response.json();
        robotEl.style.transform = `translate(${state.pose.xMeters * pxPerMeter}px, ${-state.pose.yMeters * pxPerMeter}px) rotate(${state.pose.headingRadians}rad)`;
        renderStats(state);
        renderModules(state);
        renderGamepadStatus(state.gamepadConnected);
      } catch (_) {
      }
    }

    function tick(timestamp) {
      if (timestamp - lastInputPost > 50) {
        lastInputPost = timestamp;
        postInput();
      }
      requestAnimationFrame(tick);
    }

    setInterval(refreshState, 50);
    refreshState();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
